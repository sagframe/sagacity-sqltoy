name: Bug report
description: Something does not work as expected
labels: [ bug ]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: sqltoy version
      placeholder: "e.g. 6.0.6"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: JDK, Spring Boot (or Solon), database and version
      placeholder: "e.g. JDK 21, Spring Boot 4.1, PostgreSQL 16"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal sql/xml + java snippet helps a lot — see https://github.com/sagframe/sqltoy-quickstart for runnable examples.
      render: java
  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      render: shell
